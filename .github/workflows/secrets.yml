name: Secrets
on:
  pull_request:
  push:
    branches: [main]

# Fails the check if a key, token or private key is in any commit, so it is caught before the repository is public.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner --config /repo/.gitleaks.toml --log-opts="--all"
